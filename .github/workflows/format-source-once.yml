name: format-source-once

on:
  push:
    branches:
      - chore/code-quality-frontend-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run source formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/code-quality-frontend-foundation

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 格式化仓库维护源码
        run: >-
          npx --yes prettier@3.6.2 --write
          "model/**/*.{ts,js,mjs,json}"
          "dat/**/*.{ts,js,mjs,json}"
          "adventure/**/*.{ts,js,mjs,json}"
          "engine/**/*.{ts,js,mjs,json}"
          "editor/**/*.{ts,js,mjs,css,json}"
          "web/**/*.{ts,js,mjs,css,html,json}"
          "tools/**/*.{ts,js,mjs,json}"
          "package.json"
          "tsconfig*.json"

      - name: 验证源码质量
        run: npm run source:check

      - name: 提交格式化结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model dat adventure engine editor web tools package.json tsconfig.json tsconfig.base.json
          if git diff --cached --quiet; then
            echo "没有需要提交的格式变化"
            exit 0
          fi
          git commit -m "style: format maintained source"
          git push origin HEAD:chore/code-quality-frontend-foundation
