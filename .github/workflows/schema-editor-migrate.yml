name: schema-editor-migrate

on:
  push:
    branches: [schema/entity-map-contract]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema/entity-map-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schema examples
        run: npm run schema:examples
      - name: Verify
        run: npm run verify
