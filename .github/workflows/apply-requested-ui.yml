name: apply-requested-ui

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-requested-ui
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-pages-debug
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/scripts/apply-requested-ui-changes.py')
          text = path.read_text(encoding='utf-8')
          marker = "    return text.replace(old, new, 1)\n\n\n# Input:"
          helper = "    return text.replace(old, new, 1)\n\n\ndef replace_first(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count < 1:\n        raise RuntimeError(f'{label}: expected at least 1 match, found {count}')\n    return text.replace(old, new, 1)\n\n\n# Input:"
          if marker not in text:
              raise SystemExit('helper insertion marker missing')
          text = text.replace(marker, helper, 1)
          old = "main = replace_once(main,\n'''  activeInput = new InputController(activeGame);"
          new = "main = replace_first(main,\n'''  activeInput = new InputController(activeGame);"
          if old not in text:
              raise SystemExit('official input replacement marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/scripts/apply-requested-ui-changes.py
      - run: npm run verify
      - name: Commit applied changes
        run: |
          rm tools/scripts/apply-requested-ui-changes.py
          rm tools/scripts/apply-requested-ui-changes.mjs
          rm .github/workflows/apply-requested-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- engine/src/render/Camera.ts engine/src/input/InputController.ts engine/src/core/Game.ts engine/src/render/Renderer.ts web/index.html web/src/main.ts web/src/TinySynthAudio.ts web/style.css .github/workflows/pages.yml tools/scripts/apply-requested-ui-changes.py tools/scripts/apply-requested-ui-changes.mjs .github/workflows/apply-requested-ui.yml
          git commit -m "web: improve mobile controls debug HUD and Pages"
          git push origin HEAD:feature/mobile-pages-debug
