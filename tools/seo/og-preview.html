<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Bobby Carrot 5 Remake — 分享图</title>
    <style>
      @font-face {
        font-family: "Jersey 10";
        src: url("../../assets/ui/fonts/jersey-10/Jersey10-Regular.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #093b63;
        color: #fff8df;
        font-family: "Jersey 10", Impact, sans-serif;
      }

      .artboard {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(ellipse at 73% 40%, #279dc5 0%, transparent 62%),
          linear-gradient(135deg, #145f8a 0%, #0d527b 48%, #082e52 100%);
      }

      .artboard::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background-image:
          linear-gradient(rgb(179 233 255 / 4%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(179 233 255 / 4%) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(135deg, #000, transparent 75%);
        content: "";
      }

      .artboard::after {
        position: absolute;
        right: 48px;
        bottom: 30px;
        left: 48px;
        height: 2px;
        background: linear-gradient(90deg, #f9cf69 0 64px, rgb(173 222 243 / 20%) 64px);
        content: "";
      }

      .brand {
        position: absolute;
        top: 64px;
        left: 48px;
        width: 352px;
        margin: 0;
        text-align: center;
        font-weight: 400;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        filter: drop-shadow(0 7px 0 rgb(3 28 52 / 35%));
      }

      .remake {
        display: inline-block;
        margin-top: 19px;
        padding: 5px 21px 6px 27px;
        border-top: 1px solid rgb(255 221 142 / 65%);
        border-bottom: 1px solid rgb(255 221 142 / 65%);
        background: rgb(5 37 65 / 35%);
        color: #ffdc83;
        font-size: 29px;
        line-height: 1;
        letter-spacing: 6px;
        text-shadow: 0 2px 0 #163e59;
      }

      .sparkle {
        position: absolute;
        z-index: -1;
        width: 14px;
        height: 14px;
        background: #ffdc83;
        clip-path: polygon(36% 0, 64% 0, 64% 36%, 100% 36%, 100% 64%, 64% 64%, 64% 100%, 36% 100%, 36% 64%, 0 64%, 0 36%, 36% 36%);
      }

      .sparkle-one {
        top: 34px;
        left: 62px;
      }

      .sparkle-two {
        top: 44px;
        left: 398px;
        width: 9px;
        height: 9px;
        opacity: 0.55;
      }

      .sparkle-three {
        right: 40px;
        bottom: 59px;
        width: 10px;
        height: 10px;
        opacity: 0.7;
      }

      .features {
        position: absolute;
        top: 340px;
        left: 58px;
        display: grid;
        gap: 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .features li {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 48px;
        font-size: 43px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
        text-shadow: 0 3px 0 #082e4e;
      }

      .feature-marker {
        flex: 0 0 12px;
        width: 12px;
        height: 12px;
        background: #ffce68;
        box-shadow: 3px 3px 0 #07334f;
      }

      .gameplay {
        position: absolute;
        top: 76px;
        right: 48px;
        width: 704px;
        margin: 0;
      }

      .gameplay-frame {
        padding: 6px;
        border: 2px solid #a4d8e8;
        background: #093b5c;
        box-shadow:
          0 0 0 4px #092f4f,
          10px 12px 0 rgb(3 29 50 / 40%),
          0 24px 48px rgb(0 20 40 / 30%);
      }

      .gameplay img {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
      }

      .gameplay figcaption {
        margin-top: 25px;
        color: #c2e5ee;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 2px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="artboard">
      <span class="sparkle sparkle-one" aria-hidden="true"></span>
      <span class="sparkle sparkle-two" aria-hidden="true"></span>
      <span class="sparkle sparkle-three" aria-hidden="true"></span>

      <h1 class="brand" aria-label="Bobby Carrot 5 Remake">
        <img class="logo" src="../../assets/art/hd/title.png" width="335" height="177" alt="Bobby Carrot 5" />
        <span class="remake">REMAKE</span>
      </h1>

      <ul class="features">
        <li>
          <span class="feature-marker" aria-hidden="true"></span>
          <span>480 Levels +</span>
        </li>
        <li>
          <span class="feature-marker" aria-hidden="true"></span>
          <span>Play in Browser</span>
        </li>
        <li>
          <span class="feature-marker" aria-hidden="true"></span>
          <span>Map Editor</span>
        </li>
      </ul>

      <figure class="gameplay">
        <div class="gameplay-frame">
          <img src="./screenshot-18-8.png" alt="Bobby exploring a puzzle with carrots, switches and conveyor belts" />
        </div>
        <figcaption>PLAY. SOLVE. CREATE.</figcaption>
      </figure>
    </main>
  </body>
</html>
