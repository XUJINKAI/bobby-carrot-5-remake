name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 本轮迁移临时步骤：把历史压缩源码真正格式化并提交到 PR 分支。
      - name: 格式化全部维护源码
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/code-quality-frontend-foundation'
        run: >-
          npx --yes prettier@3.6.2 --write
          "model/**/*.{ts,js,mjs,json}"
          "dat/**/*.{ts,js,mjs,json}"
          "adventure/**/*.{ts,js,mjs,json}"
          "engine/**/*.{ts,js,mjs,json}"
          "editor/**/*.{ts,js,mjs,css,json}"
          "web/**/*.{ts,js,mjs,css,html,json}"
          "tools/**/*.{ts,js,mjs,json}"
          "package.json"
          "tsconfig*.json"

      - name: 提交格式化结果
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/code-quality-frontend-foundation'
        run: |
          if git diff --quiet; then
            echo "源码已经全部格式化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add model dat adventure engine editor web tools package.json tsconfig.json tsconfig.base.json
            git commit -m "style: format all maintained source"
            git push origin HEAD:chore/code-quality-frontend-foundation
          fi

      - run: npm run verify
