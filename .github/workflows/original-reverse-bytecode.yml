name: Original reverse bytecode

on:
  push:
    branches:
      - reverse/original-runtime
    paths:
      - .github/workflows/original-reverse-bytecode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reverse/original-runtime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract runtime classes
        run: |
          rm -rf tmp/original-reverse/javap
          mkdir -p tmp/original-reverse/javap
          cd tmp/original-reverse/javap
          jar xf ../../../original/official-hd/up09.jar Bobby.class a.class

      - name: Disassemble runtime
        run: |
          mkdir -p original/reverse-engineering/bytecode/up09
          javap -classpath tmp/original-reverse/javap -c -p -s Bobby > original/reverse-engineering/bytecode/up09/Bobby.javap.txt
          javap -classpath tmp/original-reverse/javap -c -p -s a > original/reverse-engineering/bytecode/up09/a.javap.txt

      - name: Extract key method slices
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('original/reverse-engineering/bytecode/up09/a.javap.txt')
          lines = src.read_text().splitlines()
          out = Path('original/reverse-engineering/bytecode/up09/methods')
          out.mkdir(parents=True, exist_ok=True)

          targets = {
              'load-level-e-int-int': 'private final void e(int, int);',
              'gameplay-H': 'private final boolean H();',
              'player-movement-M': 'private final boolean M();',
              'pixel-motion-N': 'private final void N();',
              'player-collision-a-int-int-boolean': 'private final boolean a(int, int, boolean);',
              'moving-entity-grid-pass-a-int-int-int-byte': 'private final boolean a(int, int, int, byte);',
              'moving-entity-pixel-collision-a-int-int-int-int': 'private final boolean a(int, int, int, int);',
              'moving-entities-P': 'private final void P();',
              'arrival-J': 'private final void J();',
              'fireball-Q': 'private final void Q();',
              'ice-melting-R': 'private final void R();',
              'bean-growth-S': 'private final void S();',
              'runtime-b': 'public final boolean b();',
              'main-loop-run': 'public void run();',
          }

          method_starts = []
          for i, line in enumerate(lines):
              if line.startswith('  ') and not line.startswith('    ') and line.rstrip().endswith(';'):
                  method_starts.append(i)

          for filename, signature in targets.items():
              try:
                  start = next(i for i, line in enumerate(lines) if line.strip() == signature)
              except StopIteration:
                  raise SystemExit(f'method not found: {signature}')

              end = len(lines)
              for candidate in method_starts:
                  if candidate > start:
                      end = candidate
                      break

              text = '\n'.join(lines[start:end]).rstrip() + '\n'
              (out / f'{filename}.javap.txt').write_text(text)
          PY

      - name: Commit bytecode baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original/reverse-engineering/bytecode/up09
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "reverse: refresh UP9 bytecode method slices"
          git push origin HEAD:reverse/original-runtime
