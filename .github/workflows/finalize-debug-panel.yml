name: finalize-debug-panel

on:
  push:
    branches: [refactor/composable-tile-behaviors]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/composable-tile-behaviors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/scripts/finalize-debug-panel.mjs
      - run: npm run verify
      - name: Commit final debug layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- web/src/main.ts web/style.css
          git commit -m "web: finalize debug panel layout"
          git push origin HEAD:refactor/composable-tile-behaviors
