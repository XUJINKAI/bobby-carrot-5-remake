name: Original reverse index

on:
  push:
    branches:
      - reverse/original-runtime
    paths:
      - .github/workflows/original-reverse-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reverse/original-runtime

      - name: Build source index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src_path = Path('original/reverse-engineering/decompiled/up09/a.java')
          out_path = Path('original/reverse-engineering/notes/up09-symbol-index.md')
          text = src_path.read_text(encoding='utf-8')
          lines = text.splitlines()

          method_re = re.compile(r'^\s*(?:public|private|protected)\s+(?:static\s+)?(?:final\s+)?[^=;]+\([^;]*\)\s*(?:throws\s+[^\{]+)?\{\s*$')
          methods = []
          for i, line in enumerate(lines, 1):
              if method_re.match(line):
                  methods.append((i, line.strip()))

          symbols = ['cu', 'cv', 'dH', 'dI', 'bC', 'bD', 'bE', 'bF', 'aw', 'aF', 'aG']
          occurrences = {}
          for sym in symbols:
              pat = re.compile(rf'\bthis\.{re.escape(sym)}\b')
              hits = []
              for i, line in enumerate(lines, 1):
                  if pat.search(line):
                      hits.append((i, line.strip()))
              occurrences[sym] = hits[:80]

          with out_path.open('w', encoding='utf-8') as f:
              f.write('# UP9 `a.java` 符号索引\n\n')
              f.write('本文件由机械脚本从 CFR 反编译基准生成，用于给语义化整理提供稳定行号入口。行号对应 `decompiled/up09/a.java`。\n\n')
              f.write('## 方法入口\n\n')
              for line_no, sig in methods:
                  f.write(f'- L{line_no}: `{sig}`\n')
              f.write('\n## 重点字段出现位置\n')
              for sym, hits in occurrences.items():
                  f.write(f'\n### `{sym}`\n\n')
                  for line_no, line in hits:
                      escaped = line.replace('`', '\\`')
                      f.write(f'- L{line_no}: `{escaped}`\n')
          PY

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original/reverse-engineering/notes/up09-symbol-index.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "reverse: index UP9 runtime symbols"
          git push origin HEAD:reverse/original-runtime
