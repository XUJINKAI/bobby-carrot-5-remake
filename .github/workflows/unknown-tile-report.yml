name: unknown-tile-report
on:
  push:
    branches: [analysis/unknown-tile-report]
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/scripts/report-unknown-tiles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: unknown-tiles
          path: tmp/unknown-tiles.json
