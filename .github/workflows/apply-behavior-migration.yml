name: apply-behavior-migration

on:
  push:
    branches: [refactor/composable-tile-behaviors]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/composable-tile-behaviors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply and verify migration
        id: migrate
        shell: bash
        run: |
          set +e
          node tools/scripts/apply-behavior-migration.mjs > /tmp/migration.log 2>&1
          status=$?
          if [ $status -eq 0 ]; then
            node tools/scripts/fix-behavior-migration.mjs >> /tmp/migration.log 2>&1
            status=$?
          fi
          if [ $status -eq 0 ]; then
            npm run verify >> /tmp/migration.log 2>&1
            status=$?
          fi
          cat /tmp/migration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ $status -ne 0 ]; then
            mkdir -p tmp
            cp /tmp/migration.log tmp/behavior-migration-error.txt
          fi
          exit 0
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.migrate.outputs.status }}" = "0" ]; then
            git add -- engine/src/mechanics/definitions.ts engine/src/mechanics/rules.ts engine/src/mechanics/terrainTraits.ts engine/src/world/World.ts engine/src/index.ts web/src/main.ts
            git commit -m "engine: centralize remaining tile semantics" || exit 0
          else
            git add -f -- tmp/behavior-migration-error.txt
            git commit -m "debug: capture behavior migration failure" || exit 0
          fi
          git push origin HEAD:refactor/composable-tile-behaviors
