name: Original reverse state trace

on:
  push:
    branches:
      - reverse/original-runtime
    paths:
      - .github/workflows/original-reverse-state-trace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reverse/original-runtime
          fetch-depth: 0

      - name: Extract state references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('original/reverse-engineering/decompiled/up09/a.java')
          lines = src.read_text(encoding='utf-8').splitlines()
          out = Path('original/reverse-engineering/notes/state-traces')
          out.mkdir(parents=True, exist_ok=True)

          symbols = [
              'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J',
              'an', 'bU', 'bV', 'bW',
              'bn', 'bh', 'bi', 'bj', 'bk', 'bl', 'bm', 'bo',
              'cV', 'cW', 'cX', 'cY', 'cZ',
              'aN', 'aO', 'aT', 'bc', 'bd', 'be', 'bf', 'bg',
              'de', 'df', 'dg', 'dO', 'dP', 'dQ', 'eB', 'eg'
          ]

          for symbol in symbols:
              pattern = re.compile(rf'\bthis\.{re.escape(symbol)}\b')
              chunks = []
              for i, line in enumerate(lines):
                  if not pattern.search(line):
                      continue
                  start = max(0, i - 4)
                  end = min(len(lines), i + 5)
                  chunks.append((i + 1, lines[start:end]))

              with (out / f'{symbol}.md').open('w', encoding='utf-8') as f:
                  f.write(f'# `a.{symbol}` 引用上下文\n\n')
                  f.write('机械摘录自 `decompiled/up09/a.java`，仅用于逆向定位，不代表语义命名。\n\n')
                  for line_no, chunk in chunks:
                      f.write(f'## L{line_no}\n\n```java\n')
                      f.write('\n'.join(chunk))
                      f.write('\n```\n\n')
          PY

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original/reverse-engineering/notes/state-traces
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "reverse: trace UP9 runtime state fields"
          git pull --rebase origin reverse/original-runtime
          git push origin HEAD:reverse/original-runtime
