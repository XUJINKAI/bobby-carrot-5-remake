name: Original reverse bytecode

on:
  push:
    branches:
      - reverse/original-runtime
    paths:
      - .github/workflows/original-reverse-bytecode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reverse/original-runtime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract runtime classes
        run: |
          rm -rf tmp/original-reverse/javap
          mkdir -p tmp/original-reverse/javap
          cd tmp/original-reverse/javap
          jar xf ../../../original/official-hd/up09.jar Bobby.class a.class

      - name: Disassemble runtime
        run: |
          mkdir -p original/reverse-engineering/bytecode/up09
          javap -classpath tmp/original-reverse/javap -c -p -s Bobby > original/reverse-engineering/bytecode/up09/Bobby.javap.txt
          javap -classpath tmp/original-reverse/javap -c -p -s a > original/reverse-engineering/bytecode/up09/a.javap.txt

      - name: Commit bytecode baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original/reverse-engineering/bytecode/up09
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "reverse: add UP9 bytecode baseline"
          git push origin HEAD:reverse/original-runtime
