<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bobby Engine Playground</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <strong>Bobby Engine Playground</strong>
    <label>Level <select id="level"></select></label>
    <button id="prev">←</button>
    <button id="next">→</button>
    <button id="undo">Undo</button>
    <button id="restart">Restart</button>
    <button id="zoom-out">−</button>
    <span id="zoom">100%</span>
    <button id="zoom-in">+</button>
    <label><input id="debug" type="checkbox" /> Debug</label>
  </header>
  <main>
    <section class="stage"><canvas id="game"></canvas></section>
    <aside>
      <h2>Inspector</h2>
      <pre id="inspector">Click a tile while Debug is enabled.</pre>
      <h2>State</h2>
      <pre id="state"></pre>
      <p>Keyboard: WASD / arrows · R restart · Z undo · F2 debug · wheel/pinch zoom · swipe to move.</p>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
