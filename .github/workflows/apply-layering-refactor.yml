# one-shot refactor applicator; self-deletes after a successful verified patch
name: apply-layering-refactor

on:
  push:
    branches: [reverse/original-layering-engine]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reverse/original-layering-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply evidence-backed layering fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(text.replace(old, new, 1))

          replace('engine/src/mechanics/rules.ts',
          """  // 潮汐/水面不能直接步行；动态荷叶单独处理。\n  if (isWaterTerrain(terrainId)) {\n    return { passable: false, reason: '水面需要荷叶等动态载具', confidence: 'confirmed' };\n  }\n\n  if (!isOrdinaryWalkableTerrain(terrainId) && objectId !== ObjectId.BEANSTALK_TIP && objectId !== ObjectId.BEANSTALK_BASE && objectId !== ObjectId.PLANK && objectId !== ObjectId.BEANSTALK_MID) {\n    return { passable: false, reason: `地形 0x${terrainId.toString(16).toUpperCase()} 不可直接通行`, confidence: 'inferred' };\n  }\n""",
          """  // 原版 terrain/object 是独立层：D4 木板和 CE/DE/EE 藤蔓可以覆盖底层不可步行地形。\n  const objectOverridesTerrain = objectId === ObjectId.PLANK\n    || objectId === ObjectId.BEANSTALK_TIP\n    || objectId === ObjectId.BEANSTALK_MID\n    || objectId === ObjectId.BEANSTALK_BASE;\n\n  if (isWaterTerrain(terrainId) && !objectOverridesTerrain) {\n    return { passable: false, reason: '水面需要荷叶或桥面等覆盖对象', confidence: 'confirmed' };\n  }\n\n  if (!isOrdinaryWalkableTerrain(terrainId) && !objectOverridesTerrain) {\n    return { passable: false, reason: `地形 0x${terrainId.toString(16).toUpperCase()} 不可直接通行`, confidence: 'inferred' };\n  }\n""")

          replace('engine/src/world/World.ts',
          """    // 割草动作发生在站上格子后；隐藏目标立即变成可交互对象。\n    if (terrain === Terrain.HIGH_GRASS || terrain === Terrain.HIGH_GRASS_OBJECTIVE) {\n      const hidden = terrain === Terrain.HIGH_GRASS_OBJECTIVE;\n      const ground = GROUND_AFTER_MOW[(point.x * 17 + point.y * 31) & 3]!;\n      this.setTerrain(point.x, point.y, ground);\n      if (hidden) this.setObject(point.x, point.y, state.objectiveMode === 'carrot' ? ObjectId.CARROT : ObjectId.EGG_NEST_EMPTY);\n      events.push({ type: 'mow', message: hidden ? '割开高草，发现目标' : '割开高草', ...point });\n      terrain = ground;\n      object = this.objectIdAt(point.x, point.y);\n    }\n""",
          """    // Terrain 与 Object 是独立层。割草只揭掉 Terrain 覆盖，不得覆盖原 DAT 已存在的 Object。\n    if (terrain === Terrain.HIGH_GRASS || terrain === Terrain.HIGH_GRASS_OBJECTIVE) {\n      const hiddenObjective = terrain === Terrain.HIGH_GRASS_OBJECTIVE;\n      const ground = GROUND_AFTER_MOW[(point.x * 17 + point.y * 31) & 3]!;\n      this.setTerrain(point.x, point.y, ground);\n      if (hiddenObjective && object === EMPTY_OBJECT) {\n        this.setObject(point.x, point.y, state.objectiveMode === 'carrot' ? ObjectId.CARROT : ObjectId.EGG_NEST_EMPTY);\n      }\n      events.push({ type: 'mow', message: hiddenObjective ? '割开高草，发现目标' : '割开高草', ...point });\n      return;\n    }\n""")

          replace('engine/src/world/World.ts', "if (terrain === Terrain.CAROUSEL_SWITCH_B || terrain === Terrain.CAROUSEL_SWITCH_A) {", "if (terrain === Terrain.CAROUSEL_SWITCH_A) {")
          replace('engine/src/world/World.ts', "if (terrain === Terrain.SPEED_SWITCH_A || terrain === Terrain.SPEED_SWITCH_B) {", "if (terrain === Terrain.SPEED_SWITCH_A) {")
          replace('engine/src/world/World.ts', "if (terrain === Terrain.TIDE_SWITCH_A || terrain === Terrain.TIDE_SWITCH_B) {", "if (terrain === Terrain.TIDE_SWITCH_A) {")
          replace('engine/src/world/World.ts', "if (terrain === Terrain.COLOR_YELLOW_SWITCH_A || terrain === Terrain.COLOR_YELLOW_SWITCH_B) {", "if (terrain === Terrain.COLOR_YELLOW_SWITCH_A) {")
          replace('engine/src/world/World.ts', "} else if (terrain === Terrain.COLOR_PINK_SWITCH_A || terrain === Terrain.COLOR_PINK_SWITCH_B) {", "} else if (terrain === Terrain.COLOR_PINK_SWITCH_A) {")

          replace('engine/src/render/Renderer.ts', "import { ObjectId, type Direction } from '../mechanics/ids.js';", "import { ObjectId, Terrain, type Direction } from '../mechanics/ids.js';")
          replace('engine/src/render/Renderer.ts',
          """        const object = world.objectIdAt(x, y);\n        if (object !== ObjectId.EMPTY) {\n          const animatedObject = this.animationAtlas ? animatedObjectTile(object, world.state, animationElapsed) : null;\n          if (animatedObject && this.animationAtlas) this.drawAnimationTile(this.animationAtlas, animatedObject.taIndex, screen.x, screen.y, size);\n          else this.drawAtlasTile(atlas, object, screen.x, screen.y, size);\n        }\n""",
          """        const object = world.objectIdAt(x, y);\n        const objectCoveredByGrass = terrain === Terrain.HIGH_GRASS || terrain === Terrain.HIGH_GRASS_OBJECTIVE;\n        if (object !== ObjectId.EMPTY && !objectCoveredByGrass) {\n          const animatedObject = this.animationAtlas ? animatedObjectTile(object, world.state, animationElapsed) : null;\n          if (animatedObject && this.animationAtlas) this.drawAnimationTile(this.animationAtlas, animatedObject.taIndex, screen.x, screen.y, size);\n          else this.drawAtlasTile(atlas, object, screen.x, screen.y, size);\n        }\n""")

          replace('editor/src/Editor.ts',
          "    for (const object of this.level.objects) this.drawAtlasTile(context, object.id, object.x, object.y);",
          """    for (const object of this.level.objects) {\n      const terrain = this.level.terrain[object.y]?.[object.x];\n      if (terrain === Terrain.HIGH_GRASS || terrain === Terrain.HIGH_GRASS_OBJECTIVE) continue;\n      this.drawAtlasTile(context, object.id, object.x, object.y);\n    }""")

          tests = Path('engine/tests/runtime-fidelity.test.mjs')
          text = tests.read_text()
          if "test('水面木板属于 Object 覆盖 Terrain" not in text:
              text += r'''

test('水面木板属于 Object 覆盖 Terrain；木板消失后底层水重新阻挡', () => {
  const world = new World(level({ width: 5, height: 1, terrain: [[0x95, 0x56, 0x90, 0x90, 0x90]], objects: [object(0xd4, 1, 0)] }));
  assert.equal(world.move('right').moved, true);
  assert.equal(world.move('right').moved, true);
  assert.equal(world.objectIdAt(1, 0), 0xd5);
  assert.equal(world.move('right').moved, true);
  assert.equal(world.objectIdAt(1, 0), EMPTY);
  assert.equal(world.move('left').moved, true);
  assert.equal(world.move('left').moved, false);
});

test('高草覆盖已有 Bonus Coin；割草只揭示，不覆盖也不在同一拍自动收集', () => {
  const world = new World(level({ width: 3, height: 1, terrain: [[0x95, 0xc7, 0x90]], objects: [object(0xf8, 1, 0)] }));
  world.state.ridingMower = true;
  assert.equal(world.move('right').moved, true);
  assert.notEqual(world.terrainAt(1, 0), 0xc7);
  assert.equal(world.objectIdAt(1, 0), 0xf8);
  assert.equal(world.state.bonusCoinsInLevel, 0);
  assert.equal(world.move('left').moved, true);
  assert.equal(world.move('right').moved, true);
  assert.equal(world.objectIdAt(1, 0), EMPTY);
  assert.equal(world.state.bonusCoinsInLevel, 1);
});

test('A/B 型按钮只有未按下 A 状态触发；B 状态不重复触发', () => {
  const world = new World(level({ width: 4, height: 1, terrain: [[0x95, 0xa1, 0x90, 0xb5]] }));
  assert.equal(world.move('right').moved, true);
  assert.equal(world.terrainAt(1, 0), 0xa2);
  assert.equal(world.terrainAt(3, 0), 0xb6);
  assert.equal(world.move('left').moved, true);
  assert.equal(world.move('right').moved, true);
  assert.equal(world.terrainAt(1, 0), 0xa2);
  assert.equal(world.terrainAt(3, 0), 0xb6);
});
'''
              tests.write_text(text)

          Path('.github/workflows/apply-layering-refactor.yml').unlink()
      - run: npm ci
      - run: npm run verify
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- engine/src/mechanics/rules.ts engine/src/world/World.ts engine/src/render/Renderer.ts editor/src/Editor.ts engine/tests/runtime-fidelity.test.mjs .github/workflows/apply-layering-refactor.yml
          git commit -m "engine: restore terrain object layering semantics"
          git push origin HEAD:reverse/original-layering-engine
