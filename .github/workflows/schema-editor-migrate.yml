name: schema-editor-migrate

on:
  push:
    branches: [schema/entity-map-contract]
    paths:
      - .github/workflows/schema-editor-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema/entity-map-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply remaining contract migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("engine/src/debug/DebugSnapshot.ts", "  properties: unknown;\n", "")
          replace_once("engine/src/debug/DebugSnapshot.ts", "    properties: entity.properties ? structuredClone(entity.properties) : null,\n", "")

          replace_once(
            "editor/src/authoring/rules.ts",
            '  if (entity.type === selector || entity.traits?.includes(selector)) return true;',
            '  if (entity.type === selector) return true;',
          )
          replace_once(
            "editor/src/authoring/variants.ts",
            '  const result = structuredClone(entity);',
            '  const result: LevelEntity = structuredClone(entity) as LevelEntity;',
          )
          replace_once(
            "editor/src/canvas/EditorEntityPreviewRenderer.ts",
            '      name: "Entity Preview",',
            '      meta: { name: "Entity Preview" },',
          )

          path = "web/src/app/BobbyApp.ts"
          replace_once(path, "  type PageController,\n", "  type PageController,\n  type ResolvedMapCollection,\n")
          replace_once(path, "  private collections: MapCollectionIndex[] = [];", "  private collections: ResolvedMapCollection[] = [];")
          replace_once(path, "            title: imported.value.name,", "            title: imported.value.meta.name,")
          replace_once(path, "        identity: { ...ref, title: level.name },", "        identity: { ...ref, title: level.meta.name },")
          replace_once(
            path,
            '''      const resolved = await resolveMapDocument(ref);\n      this.controller = await renderGamePage({''',
            '''      const resolved = await resolveMapDocument(ref);\n      const collection = context.collections.find((item) => item.id === ref.collection);\n      const currentIndex = collection?.maps.findIndex((item) => item.id === ref.id) ?? -1;\n      const exploreNextMapId =\n        currentIndex >= 0 ? collection?.maps[currentIndex + 1]?.id : undefined;\n      this.controller = await renderGamePage({''',
          )
          replace_once(
            path,
            '''        mapMeta: resolved.document.meta,\n        identity: { ...resolved.ref, title: resolved.document.meta.name },\n        mode: "explore",''',
            '''        mapMeta: resolved.document.meta,\n        identity: { ...resolved.ref, title: resolved.document.meta.name },\n        ...(exploreNextMapId ? { exploreNextMapId } : {}),\n        mode: "explore",''',
          )
          replace_once(
            path,
            '''        collectionsIndex.collections.map((collection) =>\n          fetchJson<MapCollectionIndex>(\n            siteUrl(`assets/maps/${collection.id}/index.json`),\n          ),\n        ),''',
            '''        collectionsIndex.collections.map(async (collection) => ({\n          id: collection.id,\n          ...(await fetchJson<MapCollectionIndex>(\n            siteUrl(`assets/maps/${collection.id}/index.json`),\n          )),\n        })),''',
          )

          path = "web/src/pages/editor/mountEditorPage.ts"
          replace_once(
            path,
            '''      level = fromLevelMap(resolved.level);\n      level.name = `${resolved.document.meta.name} · 副本`;''',
            '''      level = fromLevelMap(\n        resolved.level,\n        `${resolved.document.meta.name} · 副本`,\n      );''',
          )

          path = "web/src/pages/game/mountGamePage.ts"
          replace_once(path, "  mapMeta?: MapMeta;\n", "  mapMeta?: MapMeta;\n  exploreNextMapId?: string;\n")
          replace_once(path, "    mapMeta,\n", "    mapMeta,\n    exploreNextMapId,\n")
          replace_once(
            path,
            '  audio.playMusic(mapMeta?.music ?? (isBonus ? "bonus" : "ingame1"));',
            '''  if (level.music === "none") audio.stopMusic();\n  else\n    audio.playMusic(\n      level.music && level.music !== "random"\n        ? level.music\n        : isBonus\n          ? "bonus"\n          : "ingame1",\n    );''',
          )
          replace_once(path, "        nextId = mapMeta?.next;", "        nextId = exploreNextMapId;")
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/src/debug/DebugSnapshot.ts editor/src/authoring/rules.ts editor/src/authoring/variants.ts editor/src/canvas/EditorEntityPreviewRenderer.ts web/src/app/BobbyApp.ts web/src/pages/editor/mountEditorPage.ts web/src/pages/game/mountGamePage.ts
          git commit -m "refactor(schema): clear remaining document contract leaks"
          git push origin HEAD:schema/entity-map-contract
      - name: TypeScript diagnosis
        run: npx tsc -b
