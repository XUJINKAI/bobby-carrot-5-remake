name: semantic-branch-verify

on:
  push:
    branches: [semantic/dat-codec-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply narrow Web semantic codemod
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'web/src/main.ts';
          let text = fs.readFileSync(path, 'utf8');
          const beforeLock = "const hasLock = level.objects.some((object) => object.id === 0xcd);";
          const afterLock = "const hasLock = level.objects.some((object) => object.type === ObjectId.LOCK);";
          if (text.includes(beforeLock)) text = text.replace(beforeLock, afterLock);
          const beforeDebug = `function formatTileInspection(tile: TileInspection): string {\n  const dynamic = tile.dynamicEntity ? \` · Dynamic 0x\${tile.dynamicEntity.id.toString(16).toUpperCase()}\` : '';\n  return \`DEBUG \${tile.x},\${tile.y} · Terrain \${tile.terrainHexId} · Object \${tile.object ? tile.objectHexId : 'EMPTY'}\${dynamic}\${tile.isPlayer ? ' · BOBBY' : ''}\`;\n}`;
          const afterDebug = `function formatTileInspection(tile: TileInspection): string {\n  const dynamic = tile.dynamicEntity ? \` · Dynamic \${tile.dynamicEntity.type}\` : '';\n  return \`DEBUG \${tile.x},\${tile.y} · Terrain \${tile.terrainType} · Object \${tile.object ? tile.objectType : 'empty'}\${dynamic}\${tile.isPlayer ? ' · BOBBY' : ''}\`;\n}`;
          if (text.includes(beforeDebug)) text = text.replace(beforeDebug, afterDebug);
          if (!text.includes("ObjectId.LOCK")) {
            text = text.replace("  InputController,\n", "  InputController,\n  ObjectId,\n");
          } else if (!/^\s*ObjectId,/m.test(text.slice(0, 300))) {
            text = text.replace("  InputController,\n", "  InputController,\n  ObjectId,\n");
          }
          fs.writeFileSync(path, text);
          NODE
      - run: npm ci
      - run: npm run verify
      - name: Commit codemod on branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- web/src/main.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/main.ts
            git commit -m "web: use semantic level identities"
            git push origin HEAD:semantic/dat-codec-boundary
          fi
